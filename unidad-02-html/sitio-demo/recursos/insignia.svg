<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- circle: se ubica en el centro (cx,cy) y su Radio (r) -->
            <circle cx="100" cy="100" r="72" fill="#F55A11"></circle>

            <!-- Fill: color de relleno -->
            <circle cx="100" cy="100" r="72" fill="#CDDFE1" stroke="#1F4E59" stroke-width="4"></circle>

            <!-- polygon: lista de vértice; la figura se cierra sola -->
            <polygon points="100,45 112,80 149,80 119,102 130,137 100,115 70,137 81,102 51,80 88,80" fill="#f5c518" stroke="#1F4E79" stroke-width="2"></polygon>

            <!-- text: código para crear texto svg -->
            <text x="100" y="160" text-anchor="middle" font-size="20" fill="#1F4E79">
              HTML
            </text>
          </svg>