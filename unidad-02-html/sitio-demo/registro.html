<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"content="Formulario de registro del sitio-demo">
    <meta name="keywords" content="registro,formulario, sitio-demo">
    <meta name="author content="Rosa.Almendarez">
    <title> Formulario| Registro</title>
</head>


<body>
    <header>
      <h1>Codificación de Páginas Web</h1>
      <p>Sitio de demostración del módulo</p>

      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="articulo.html">Articulo</a></li></li>
          <li><a href="horarios.html">Horarios</a></li></li>
          <li><a href="registro.html">Registro</a></li></li>
          <a href=""></a>
        </ul>
      </nav>

    </header>


    <main>
        <h2>Formulario de matrícula</h2>
        <form action="#" method="post">
        <!-- Form:contenedor del formulario. action: donde se envía el formulario  
        method: es el método de envío. post: envío de datos ´por el cuerpo de la solicitud -->
        <fieldset>  <!-- Contenedor de los elementos del formulario -->
             <legend>Informacion personal</legend><!-- titulo del fieldset -->
             <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required><br><br>
             </p>


             <p>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required><br><br>
             </p>

             <button type="submit">Enviar matrícula</button>

        </fieldset>
        </form>

        <fieldset>
            <legend>Detalles de Matrícula</legend>

            <p>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono"><br><br>

            <p>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha"><br><br>

            <p>
                <label for="edad">Teléfono:</label>
                <input type="number" id="edad" name="edad"><br><br>

            </p>


        </fieldset>

        <fieldset>

            <legend>Modalidad</legend>

            <input type="radio" id="presencial" name="modalidad" value="presencial">
            <label for="presencial">Presencial</label><br>
            <input type="radio" id="virtual" name="modalidad" value="virtual">
            <label for="virtual">Virtual</label><br>
            <input type="radio" id="mixta" name="modalidad" value="mixta">
            <label for="mixta">Mixta</label><br><br>
            

        

        <p>
            <label for="horario">Horario preferido</label><br>
            <select id="horario" name="horario">
                <option value="mañana">Mañana</option>
               <option value="tarde">Tarde</option>
               <option value="noche">Noche</option>
            </select><br><br>

        </p>
        
        <p>
            <label for="comentarios">Comentarios:</label><br>
            <textarea id="comentarios" name="comentarios" rows="4"></textarea><br><br>
        </p>
            </fieldset>


    </main>


     <footer>
      <!-- Footer: Pie, créditos, contacto, derechos -->
      <p>

        reservados
      </p>
    </footer>
    
</body>
</html>
